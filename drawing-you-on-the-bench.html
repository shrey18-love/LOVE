<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Drawing You On The Bench 💕</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300;1,600&family=Cinzel:wght@400;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg:        #030d12;
      --teal:      #0e4a5a;
      --teal-mid:  #1a7a8a;
      --teal-glow: #2ab8cc;
      --soft:      #7ddbe8;
      --cream:     #d6f0f5;
      --gold:      #a8d8e0;
    }

    * { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }

    body {
      min-height:100vh;
      background: var(--bg);
      font-family: 'Cormorant Garamond', serif;
      overflow-x: hidden;
    }

    body::before {
      content:'';
      position:fixed; inset:0;
      background:
        radial-gradient(ellipse at 50% 0%,   #052030 0%, transparent 55%),
        radial-gradient(ellipse at 0%  60%,  #041820 0%, transparent 45%),
        radial-gradient(ellipse at 100% 60%, #031520 0%, transparent 45%),
        radial-gradient(ellipse at 50% 100%, #04202a 0%, transparent 50%);
      pointer-events:none; z-index:0;
    }

    /* particles */
    .p {
      position:fixed; border-radius:50%;
      pointer-events:none; z-index:0; opacity:0;
      animation: drift linear infinite;
    }
    @keyframes drift {
      0%   { transform:translateY(100vh) scale(0); opacity:0; }
      10%  { opacity:0.9; }
      90%  { opacity:0.5; }
      100% { transform:translateY(-5vh) scale(1.2); opacity:0; }
    }

    .page {
      position:relative; z-index:1;
      max-width:860px;
      margin:0 auto;
      padding:3vh 3vw 5vh;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:2vh;
    }

    /* Go Back */
    .go-back {
      align-self:flex-start;
      display:inline-flex;
      align-items:center;
      gap:7px;
      text-decoration:none;
      font-family:'Cinzel', serif;
      font-size:0.72rem;
      letter-spacing:0.18em;
      text-transform:uppercase;
      color:rgba(125,219,232,0.7);
      border:1px solid rgba(42,184,204,0.3);
      border-radius:30px;
      padding:7px 18px;
      background:rgba(14,74,90,0.15);
      backdrop-filter:blur(4px);
      transition:all 0.25s ease;
      animation:fadeUp 1s ease both;
    }
    .go-back:hover {
      color:var(--cream);
      border-color:rgba(42,184,204,0.7);
      background:rgba(14,74,90,0.35);
      box-shadow:0 0 18px rgba(42,184,204,0.25);
    }

    /* Heading */
    .heading-block {
      text-align:center;
      animation:fadeUp 1.2s ease 0.1s both;
    }
    .sup-label {
      font-family:'Cinzel', serif;
      font-size:clamp(9px,0.85vw,11px);
      letter-spacing:0.32em;
      text-transform:uppercase;
      color:var(--soft);
      opacity:0.65;
      margin-bottom:8px;
    }
    h1 {
      font-weight:300; font-style:italic;
      font-size:clamp(1.8rem,3.5vw,3.2rem);
      color:var(--cream);
      text-shadow:0 0 50px rgba(42,184,204,0.4), 0 0 100px rgba(14,74,90,0.3);
      line-height:1.15;
    }
    h1 span {
      font-weight:600; font-style:normal;
      color:var(--teal-glow);
      text-shadow:0 0 28px rgba(42,184,204,0.85), 0 0 70px rgba(42,184,204,0.35);
    }

    .emoji-row {
      display:flex; gap:12px; justify-content:center;
      font-size:clamp(1rem,1.4vw,1.3rem);
      margin-top:6px;
    }
    .emoji-row span { animation:pulse 2.6s ease-in-out infinite alternate; }
    .emoji-row span:nth-child(2){animation-delay:.3s;}
    .emoji-row span:nth-child(3){animation-delay:.6s;}
    .emoji-row span:nth-child(4){animation-delay:.9s;}
    .emoji-row span:nth-child(5){animation-delay:1.2s;}

    /* Card */
    .card {
      width:100%;
      background:linear-gradient(145deg, #071820 0%, #040e14 50%, #061620 100%);
      border:1px solid rgba(42,184,204,0.28);
      border-radius:18px;
      padding:10px;
      position:relative;
      box-shadow:
        0 0 0 1px rgba(42,184,204,0.07),
        0 0 40px rgba(14,74,90,0.5),
        0 0 90px rgba(14,74,90,0.2),
        inset 0 1px 0 rgba(125,219,232,0.06);
      animation:fadeUp 1.4s ease 0.25s both;
    }
    .card::before {
      content:'';
      position:absolute; inset:-1px; border-radius:19px;
      background:linear-gradient(135deg,
        rgba(42,184,204,0.5) 0%,
        rgba(14,74,90,0.15) 35%,
        rgba(26,122,138,0.4) 65%,
        rgba(42,184,204,0.5) 100%);
      z-index:-1;
      animation:borderGlow 4s linear infinite;
    }
    @keyframes borderGlow { 0%,100%{opacity:.5} 50%{opacity:1} }

    .frame-wrap { position:relative; padding:10px 10px 0; }

    .fc {
      position:absolute;
      font-size:clamp(1rem,1.3vw,1.3rem);
      animation:pulse 3s ease-in-out infinite alternate;
      z-index:3; line-height:1;
    }
    .fc.tl { top:2px;  left:2px;  animation-delay:0s;   }
    .fc.tr { top:2px;  right:2px; animation-delay:.5s;  }
    .fc.bl { bottom:6px; left:2px;  animation-delay:1s; }
    .fc.br { bottom:6px; right:2px; animation-delay:1.5s; }

    .ornament-border {
      border:2px solid rgba(42,184,204,0.45);
      border-radius:12px;
      padding:7px;
      background:linear-gradient(135deg, #071820 0%, #030c10 100%);
      box-shadow:inset 0 0 28px rgba(14,74,90,0.25), 0 0 20px rgba(14,74,90,0.18);
      position:relative; overflow:hidden;
    }
    .ornament-border::before,
    .ornament-border::after {
      content:''; position:absolute;
      width:22px; height:22px;
      border-color:rgba(42,184,204,0.6); border-style:solid;
    }
    .ornament-border::before { top:5px; left:5px; border-width:2px 0 0 2px; border-radius:3px 0 0 0; }
    .ornament-border::after  { bottom:5px; right:5px; border-width:0 2px 2px 0; border-radius:0 0 3px 0; }

    .photo {
      width:100%;
      aspect-ratio:3/4;
      object-fit:cover;
      border-radius:7px;
      display:block;
    }

    .ribbon {
      text-align:center;
      padding:8px 8px 4px;
      font-family:'Cinzel', serif;
      font-size:clamp(0.58rem,0.7vw,0.75rem);
      letter-spacing:0.2em;
      color:rgba(42,184,204,0.55);
      text-transform:uppercase;
    }

    /* Caption */
    .caption {
      width:100%;
      background:rgba(255,255,255,0.025);
      border:1px solid rgba(42,184,204,0.12);
      border-radius:16px;
      padding:clamp(18px,2.5vw,28px) clamp(20px,3vw,36px);
      animation:fadeUp 1.6s ease 0.4s both;
      backdrop-filter:blur(4px);
      text-align:center;
    }
    .caption p {
      font-size:clamp(1rem,1.5vw,1.2rem);
      color:rgba(214,240,245,0.75);
      line-height:2;
      font-style:italic;
    }

    /* Bottom emojis */
    .bottom-emojis {
      display:flex; gap:18px;
      font-size:clamp(0.9rem,1.3vw,1.2rem);
      animation:fadeUp 1.8s ease 0.6s both;
      padding-bottom:1vh;
    }
    .bottom-emojis span { animation:floatUD 3s ease-in-out infinite alternate; }
    .bottom-emojis span:nth-child(1){animation-delay:0s;}
    .bottom-emojis span:nth-child(2){animation-delay:.4s;}
    .bottom-emojis span:nth-child(3){animation-delay:.8s;}
    .bottom-emojis span:nth-child(4){animation-delay:1.2s;}
    .bottom-emojis span:nth-child(5){animation-delay:1.6s;}

    @keyframes floatUD { from{transform:translateY(0)} to{transform:translateY(-7px)} }
    @keyframes pulse   { from{transform:scale(1);filter:brightness(1)} to{transform:scale(1.18);filter:brightness(1.3)} }
    @keyframes fadeUp  { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
  </style>
</head>
