<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You My Love</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Cormorant+Garamond:ital,wght@0,300;1,300&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}

body{
  background:linear-gradient(135deg,#ff6b9d 0%,#ff4081 30%,#f8a5c2 60%,#c2185b 100%);
  background-size:400% 400%;
  animation:gradShift 8s ease infinite;
  cursor:none;
  font-family:'Dancing Script',cursive;
  min-height:100vh;
}
@keyframes gradShift{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

#cursor{
  position:fixed;width:14px;height:14px;background:#fff;border-radius:50%;
  pointer-events:none;z-index:99999;transform:translate(-50%,-50%);
  box-shadow:0 0 10px rgba(255,80,130,1),0 0 25px rgba(255,30,100,0.6);
}

.particle{
  position:fixed;pointer-events:none;z-index:99998;
  animation:fountain var(--dur) ease-out forwards;
  transform:translate(-50%,-50%);line-height:1;
}
@keyframes fountain{
  0%{opacity:1;transform:translate(-50%,-50%) scale(0.4);}
  35%{opacity:1;transform:translate(calc(-50% + var(--vx)),calc(-50% + var(--vy1))) scale(1);}
  100%{opacity:0;transform:translate(calc(-50% + var(--vx2)),calc(-50% + var(--vy2))) scale(0.5);}
}

#page1{
  position:fixed;inset:0;z-index:10;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:18px;
}

.title-row{
  display:flex;align-items:center;justify-content:center;gap:12px;
}
.title-text{
  font-size:clamp(1.8rem,4vw,2.8rem);
  color:#fff;white-space:nowrap;
  text-shadow:0 2px 20px rgba(180,0,60,0.7);
}
.vib-heart{
  font-size:1.8rem;display:inline-block;
  animation:jump 0.9s ease-in-out infinite;
}
@keyframes jump{
  0%,100%{transform:translateY(0) scale(1);}
  40%{transform:translateY(-10px) scale(1.2);}
  60%{transform:translateY(-6px) scale(1.1);}
}

.photo-outer{
  position:relative;
  display:flex;align-items:flex-start;justify-content:center;
  padding-top:26px;
}
.pin-svg{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:24px;height:44px;z-index:30;pointer-events:none;
}
.polaroid{
  background:#f7f0e3;
  padding:13px 13px 50px 13px;
  border-radius:5px;
  box-shadow:0 16px 50px rgba(0,0,0,0.45),0 4px 14px rgba(0,0,0,0.3);
  position:relative;
  width:clamp(210px,26vw,290px);
  cursor:pointer;
  user-select:none;
  transition:transform 0.18s ease, box-shadow 0.18s ease;
}
.polaroid:hover{
  transform:scale(1.025) rotate(0.5deg);
  box-shadow:0 22px 60px rgba(0,0,0,0.5),0 6px 18px rgba(0,0,0,0.3);
}
.polaroid:active{transform:scale(0.96);}
a#photoLink{text-decoration:none;display:block;}
.polaroid img{width:100%;display:block;border-radius:3px;pointer-events:none;}

.click-note{
  font-family:'Cormorant Garamond',serif;
  font-style:italic;font-size:1rem;
  color:rgba(255,255,255,0.85);
  letter-spacing:0.04em;
  animation:pulse 2s ease-in-out infinite;
  text-align:center;
}
@keyframes pulse{0%,100%{opacity:0.55;}50%{opacity:1;}}
</style>
</head>

<script>
const cur = document.getElementById('cursor');
const sizes = ['1.1rem','1.3rem','1.5rem','1.8rem','2.1rem'];
let lx=0,ly=0,thr=0;

document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX+'px';
  cur.style.top  = e.clientY+'px';
  const dx=e.clientX-lx, dy=e.clientY-ly;
  if(Math.sqrt(dx*dx+dy*dy)>5 && Date.now()-thr>55){
    thr=Date.now(); spawn(e.clientX,e.clientY,4);
    lx=e.clientX; ly=e.clientY;
  }
});

function spawn(x,y,n){
  for(let i=0;i<n;i++){
    const el=document.createElement('div');
    el.className='particle'; el.textContent='❤️';
    el.style.fontSize=sizes[Math.floor(Math.random()*sizes.length)];
    const a=Math.random()*Math.PI*2, sp=30+Math.random()*65;
    const vx=Math.cos(a)*sp, vy1=-Math.abs(Math.sin(a)*sp*.6)-18, vy2=vy1+75+Math.random()*50;
    const dur=(.5+Math.random()*.6)+'s';
    el.style.left=x+'px'; el.style.top=y+'px';
    el.style.setProperty('--vx',vx+'px'); el.style.setProperty('--vx2',vx*1.1+'px');
    el.style.setProperty('--vy1',vy1+'px'); el.style.setProperty('--vy2',vy2+'px');
    el.style.setProperty('--dur',dur);
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), parseFloat(dur)*1000+100);
  }
}
</script>
</body>
</html>
