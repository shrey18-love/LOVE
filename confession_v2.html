<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>I have something to tell you 💕</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --rose:       #e8406a;
    --rose-light: #f7c5d2;
    --blush:      #fce8ef;
    --petal:      #fff4f7;
    --plum:       #6b2d4e;
    --gold:       #e8a045;
    --muted:      #a07080;
    --white:      #ffffff;
  }

  html, body {
    height: 100%;
    overflow-x: hidden;
  }

  body {
    background: var(--petal);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1rem;
  }

  /* ── canvas particles ── */
  #canvas {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* ── card ── */
  .card {
    position: relative;
    z-index: 1;
    background: var(--white);
    border-radius: 28px;
    padding: 3.5rem 3rem 3rem;
    max-width: 560px;
    width: 100%;
    box-shadow:
      0 2px 6px rgba(232, 64, 106, 0.07),
      0 16px 48px rgba(232, 64, 106, 0.13);
    text-align: center;
  }

  /* ── ornament ── */
  .ornament {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 1.8rem;
  }

  .ornament-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--rose-light), transparent);
    max-width: 80px;
  }

  .ornament-heart {
    font-size: 1.5rem;
    animation: beatHeart 1.6s ease-in-out infinite;
  }

  @keyframes beatHeart {
    0%, 100% { transform: scale(1); }
    30%       { transform: scale(1.22); }
    50%       { transform: scale(1); }
    70%       { transform: scale(1.12); }
  }

  /* ── eyebrow ── */
  .eyebrow {
    font-size: 0.72rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--rose);
    margin-bottom: 1rem;
    font-weight: 400;
  }

  /* ── title ── */
  .title {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    font-size: clamp(1.55rem, 5vw, 2.1rem);
    font-weight: 500;
    color: var(--plum);
    line-height: 1.45;
    margin-bottom: 0.75rem;
  }

  .title em {
    font-style: normal;
    color: var(--rose);
  }

  /* ── sub ── */
  .sub {
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 2.6rem;
    line-height: 1.7;
  }

  /* ── divider ── */
  .divider {
    width: 48px;
    height: 2px;
    background: var(--rose-light);
    border-radius: 2px;
    margin: 0 auto 2.4rem;
  }

  /* ── options ── */
  .options {
    display: flex;
    flex-direction: column;
    gap: 14px;
    align-items: center;
  }

  .btn {
    display: inline-block;
    padding: 14px 32px;
    border-radius: 50px;
    font-family: 'DM Sans', sans-serif;
    font-size: 0.95rem;
    font-weight: 400;
    cursor: pointer;
    border: 1.5px solid transparent;
    text-decoration: none;
    min-width: 200px;
    transition: transform 0.12s ease, box-shadow 0.12s ease;
    line-height: 1.4;
    text-align: center;
  }

  .btn:hover {
    transform: scale(1.04);
  }

  .btn-yes {
    background: var(--rose);
    color: var(--white);
    box-shadow: 0 4px 18px rgba(232, 64, 106, 0.28);
  }

  .btn-yes:hover {
    box-shadow: 0 6px 24px rgba(232, 64, 106, 0.38);
  }

  .btn-no {
    background: var(--white);
    color: var(--muted);
    border-color: var(--rose-light);
  }

  .btn-no:hover {
    border-color: var(--rose);
    color: var(--rose);
  }

  .btn-think {
    background: var(--blush);
    color: var(--plum);
    border-color: var(--rose-light);
    font-size: 0.82rem;
    padding: 12px 24px;
    min-width: 260px;
    letter-spacing: 0.01em;
  }

  .btn-think:hover {
    background: var(--rose-light);
  }

  /* flying buttons */
  .btn.is-flying {
    position: fixed;
    z-index: 9999;
    transition: top 0.38s cubic-bezier(0.22, 0.68, 0, 1.35),
                left 0.38s cubic-bezier(0.22, 0.68, 0, 1.35);
    pointer-events: all;
  }

  .gif-wrap {
    margin-bottom: 1.6rem;
  }
  .heart-gif {
    width: 145px;
    height: 145px;
    object-fit: contain;
    border-radius: 16px;
    display: block;
    margin: 0 auto;
  }

  /* ── footer note ── */
  .footnote {
    margin-top: 2.2rem;
    font-size: 0.75rem;
    color: var(--rose-light);
    letter-spacing: 0.05em;
  }

  @media (max-width: 480px) {
    .card { padding: 2.5rem 1.5rem 2rem; }
    .btn { min-width: 100%; }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div class="card">

  <div class="ornament">
    <span class="ornament-line"></span>
    <span class="ornament-heart">🌸</span>
    <span class="ornament-line"></span>
  </div>

  <p class="eyebrow">a confession</p>

  <h1 class="title">
    I am telling you after a year again —<br>
    I have a huge, <em>beautiful</em> crush on you 🥹💕
  </h1>

<script>
/* ────────────────────────────────────────────
   Particle canvas
──────────────────────────────────────────── */
(function () {
  const canvas = document.getElementById('canvas');
  const ctx    = canvas.getContext('2d');
  const SYMBOLS = ['💕','🌸','✨','💗','🥹','💝','🌷','💖','🫧'];
  let W, H, particles = [];

  function resize() {
    W = canvas.width  = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function makeParticle() {
    return {
      x:    Math.random() * W,
      y:    H + 20,
      sym:  SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)],
      size: 12 + Math.random() * 14,
      speed: 0.4 + Math.random() * 0.7,
      drift: (Math.random() - 0.5) * 0.4,
      alpha: 0.12 + Math.random() * 0.14,
      rot:  Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.015,
    };
  }

  function initParticles() {
    particles = [];
    const count = Math.min(28, Math.floor(W / 28));
    for (let i = 0; i < count; i++) {
      const p = makeParticle();
      p.y = Math.random() * H;
    }
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    if (particles.length < 28) particles.push(makeParticle());
    particles = particles.filter(p => p.y > -30);
    for (const p of particles) {
      p.y   -= p.speed;
      p.x   += p.drift;
      p.rot += p.rotSpeed;
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.font = `${p.size}px serif`;
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillText(p.sym, -p.size / 2, p.size / 2);
      ctx.restore();
    }
    requestAnimationFrame(tick);
  }

  window.addEventListener('resize', () => { resize(); initParticles(); });
  resize();
  initParticles();
  tick();
})();

/* ────────────────────────────────────────────
   Runaway buttons
──────────────────────────────────────────── */
(function () {
  const flying = new Set();

  function flyAway(btn) {
    if (!flying.has(btn)) {
      const r = btn.getBoundingClientRect();
      btn.style.width  = r.width  + 'px';
      btn.style.height = r.height + 'px';
      btn.style.top    = r.top    + 'px';
      btn.style.left   = r.left   + 'px';
      btn.classList.add('is-flying');
      flying.add(btn);
    }
    const margin = 16;
    const w = btn.offsetWidth  || 200;
    const h = btn.offsetHeight || 50;
    const maxX = window.innerWidth  - w - margin;
    const maxY = window.innerHeight - h - margin;
    btn.style.left = (margin + Math.random() * Math.max(0, maxX)) + 'px';
    btn.style.top  = (margin + Math.random() * Math.max(0, maxY)) + 'px';
  }

  document.getElementById('yesBtn').addEventListener('click', function () { flyAway(this); });
  document.getElementById('noBtn' ).addEventListener('click', function () { flyAway(this); });
})();
</script>
