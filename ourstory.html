<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Story</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Cormorant+Garamond:ital,wght@1,400;1,600&display=swap');

*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;}

body{
  background:linear-gradient(135deg,#ff6b9d 0%,#ff4081 30%,#f8a5c2 60%,#c2185b 100%);
  background-size:400% 400%;
  animation:gradShift 8s ease infinite;
  cursor:none;
  font-family:'Dancing Script',cursive;
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
}
@keyframes gradShift{
  0%{background-position:0% 50%;}
  50%{background-position:100% 50%;}
  100%{background-position:0% 50%;}
}

#cursor{
  position:fixed;width:14px;height:14px;background:#fff;border-radius:50%;
  pointer-events:none;z-index:99999;transform:translate(-50%,-50%);
  box-shadow:0 0 10px rgba(255,80,130,1),0 0 25px rgba(255,30,100,0.6);
}

.particle{
  position:fixed;pointer-events:none;z-index:99998;
  animation:fountain var(--dur) ease-out forwards;
  transform:translate(-50%,-50%);line-height:1;
}
@keyframes fountain{
  0%{opacity:1;transform:translate(-50%,-50%) scale(0.4);}
  35%{opacity:1;transform:translate(calc(-50% + var(--vx)),calc(-50% + var(--vy1))) scale(1);}
  100%{opacity:0;transform:translate(calc(-50% + var(--vx2)),calc(-50% + var(--vy2))) scale(0.5);}
}

/* MAIN CARD */
.main-card{
  width:90vw;
  height:90vh;
  border-radius:32px;
  background:rgba(255,255,255,0.13);
  border:2px solid rgba(255,255,255,0.45);
  backdrop-filter:blur(18px);
  box-shadow:0 24px 80px rgba(150,0,60,0.35), inset 0 1px 0 rgba(255,255,255,0.5);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:clamp(16px,2.5vh,30px);
  padding:clamp(20px,3vw,40px);
  position:relative;
  overflow:hidden;
}

/* subtle inner glow */
.main-card::before{
  content:'';
  position:absolute;inset:0;border-radius:32px;
  background:radial-gradient(ellipse at 50% 0%,rgba(255,255,255,0.18) 0%,transparent 65%);
  pointer-events:none;
}

/* PAGE TITLE */
.page-title{
  font-size:clamp(1.4rem,3vw,2.2rem);
  color:#fff;
  text-shadow:0 2px 18px rgba(180,0,60,0.6);
  letter-spacing:0.04em;
  text-align:center;
  z-index:1;
}

/* PHOTO GRID */
.photo-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:clamp(14px,2vw,28px);
  width:100%;
  z-index:1;
}

/* EACH PHOTO LINK */
.photo-link{
  text-decoration:none;
  display:block;
}

/* POLAROID CARD */
.polaroid{
  background:#f7f0e3;
  padding:10px 10px 44px 10px;
  border-radius:5px;
  box-shadow:0 10px 35px rgba(0,0,0,0.35), 0 3px 10px rgba(0,0,0,0.2);
  cursor:pointer;
  transition:transform 0.22s ease, box-shadow 0.22s ease;
  position:relative;
  overflow:hidden;
}
.polaroid:hover{
  transform:scale(1.07) translateY(-8px) rotate(-1deg);
  box-shadow:0 24px 55px rgba(0,0,0,0.45), 0 6px 18px rgba(200,0,60,0.3);
}
.polaroid:active{
  transform:scale(0.95) rotate(0deg);
  transition:transform 0.08s ease;
}
.polaroid img{
  width:100%;
  aspect-ratio:3/4;
  object-fit:cover;
  display:block;
  border-radius:3px;
  pointer-events:none;
}

/* CAPTION */
.caption{
  position:absolute;
  bottom:0;left:0;right:0;
  height:44px;
  display:flex;align-items:center;justify-content:center;
  font-family:'Dancing Script',cursive;
  font-size:clamp(0.6rem,1.1vw,0.82rem);
  font-weight:700;
  color:#b00015;
  text-align:center;
  padding:0 6px;
  line-height:1.2;
}

/* RIPPLE */
.ripple{
  position:fixed;border-radius:50%;
  background:rgba(255,10,60,0.28);
  pointer-events:none;z-index:99997;
  transform:translate(-50%,-50%) scale(0);
  animation:rippleOut 0.75s ease-out forwards;
}
@keyframes rippleOut{
  to{transform:translate(-50%,-50%) scale(1);opacity:0;}
}
</style>
</head>

<script>
const cur = document.getElementById('cursor');
const sizes = ['1.1rem','1.3rem','1.5rem','1.8rem','2.1rem'];
let lx=0,ly=0,thr=0;

document.addEventListener('mousemove', e => {
  cur.style.left = e.clientX+'px';
  cur.style.top  = e.clientY+'px';
  const dx=e.clientX-lx, dy=e.clientY-ly;
  if(Math.sqrt(dx*dx+dy*dy)>5 && Date.now()-thr>55){
    thr=Date.now(); spawn(e.clientX,e.clientY,4);
    lx=e.clientX; ly=e.clientY;
  }
});

function spawn(x,y,n){
  for(let i=0;i<n;i++){
    const el=document.createElement('div');
    el.className='particle'; el.textContent='❤️';
    el.style.fontSize=sizes[Math.floor(Math.random()*sizes.length)];
    const a=Math.random()*Math.PI*2, sp=30+Math.random()*65;
    const vx=Math.cos(a)*sp, vy1=-Math.abs(Math.sin(a)*sp*.6)-18, vy2=vy1+75+Math.random()*50;
    const dur=(.5+Math.random()*.6)+'s';
    el.style.left=x+'px'; el.style.top=y+'px';
    el.style.setProperty('--vx',vx+'px'); el.style.setProperty('--vx2',vx*1.1+'px');
    el.style.setProperty('--vy1',vy1+'px'); el.style.setProperty('--vy2',vy2+'px');
    el.style.setProperty('--dur',dur);
    document.body.appendChild(el);
    setTimeout(()=>el.remove(), parseFloat(dur)*1000+100);
  }
}

function photoClick(e){
  const cx=e.clientX, cy=e.clientY;
  // ripple
  const rip=document.createElement('div');
  rip.className='ripple';
  const sz=Math.max(window.innerWidth,window.innerHeight)*2+'px';
  rip.style.width=sz; rip.style.height=sz;
  rip.style.left=cx+'px'; rip.style.top=cy+'px';
  document.body.appendChild(rip);
  setTimeout(()=>rip.remove(),900);
  // heart burst
  for(let i=0;i<8;i++) setTimeout(()=>spawn(cx,cy,4),i*35);
}
</script>
